<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>localViewer — MD / YAML / CSV / STL / 3MF / STEP / images</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.0/lib/marked.esm.js",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.es.mjs",
    "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs"
  }
}
</script>

<style>
  :root{
    --bg:#101418; --panel:#171c22; --line:#2a313a; --text:#e6ebf0;
    --muted:#9aa4af; --accent:#6cb6ff; --accent-2:#80e0a7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:.6rem;padding:.5rem .75rem;
    border-bottom:1px solid var(--line);background:var(--panel);z-index:5;flex:0 0 auto}
  header h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em}
  header .badge{font-size:.7rem;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:.1rem .5rem}
  header .spacer{flex:1}
  header .fileinfo{display:flex;align-items:baseline;gap:.5rem;min-width:0;overflow:hidden}
  header .fileinfo .fname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch}
  header .fileinfo .fpath{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:48ch;direction:rtl;text-align:left}
  header button,header label{font:inherit;color:var(--text);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:.35rem .65rem;cursor:pointer}
  header button:hover,header label:hover{border-color:var(--accent)}
  header input[type=file]{display:none}
  #tabbar{display:flex;gap:.25rem;padding:.3rem .5rem 0;background:var(--panel);
    border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
  #tabbar .tab{display:flex;align-items:center;gap:.4rem;padding:.3rem .6rem;cursor:pointer;
    border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
    background:#0f1318;color:var(--muted);max-width:240px;font-size:.85rem}
  #tabbar .tab:hover{color:var(--text);border-color:var(--accent)}
  #tabbar .tab.active{background:var(--bg);color:var(--text);border-color:var(--line);
    box-shadow:inset 0 2px 0 var(--accent)}
  #tabbar .tab-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tabbar .tab-close{font:inherit;line-height:1;color:var(--muted);background:transparent;
    border:none;border-radius:4px;padding:0 .25rem;cursor:pointer}
  #tabbar .tab-close:hover{color:#ff9090;background:rgba(255,144,144,.12)}
  main{position:relative;flex:1 1 auto;min-height:0}
  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:.75rem;color:var(--muted);padding:2rem;text-align:center}
  #drop.over{background:rgba(108,182,255,.08);outline:2px dashed var(--accent);outline-offset:-12px}
  #drop .big{font-size:1.1rem;color:var(--text)}
  #drop code{background:#0b0e12;border:1px solid var(--line);padding:.1rem .35rem;border-radius:6px}
  #md{display:none;padding:2rem;max-width:880px;margin:0 auto;line-height:1.6;overflow:auto;height:100%}
  #md h1,#md h2,#md h3{border-bottom:1px solid var(--line);padding-bottom:.25rem}
  #md code{background:#0b0e12;padding:.1rem .35rem;border-radius:4px}
  #md pre{background:#0b0e12;border:1px solid var(--line);padding:.75rem;border-radius:8px;overflow:auto}
  #md table{border-collapse:collapse}
  #md th,#md td{border:1px solid var(--line);padding:.3rem .55rem}
  #md a{color:var(--accent)}
  #yaml{display:none;flex-direction:column;height:100%;overflow:hidden}
  #yaml .y-toolbar{display:flex;gap:.5rem;padding:.5rem .9rem;border-bottom:1px solid var(--line);
    background:var(--panel)}
  #yaml .y-toolbar button{font:inherit;color:var(--text);background:#0b0e12;border:1px solid var(--line);
    border-radius:6px;padding:.25rem .6rem;cursor:pointer}
  #yaml .y-toolbar button:hover{border-color:var(--accent)}
  #yaml .y-tree{padding:1rem 1.25rem;overflow:auto;max-width:980px;margin:0 auto;width:100%;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.7}
  .y-toolbar .spacer{flex:1}
  .y-toolbar label{display:flex;align-items:center;gap:.35rem;color:var(--muted);cursor:pointer}
  .y-toolbar .info{color:var(--muted);font-size:.8rem}
  #csv{display:none;flex-direction:column;height:100%;overflow:hidden}
  .csv-scroll{flex:1;overflow:auto}
  table.csv-table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.86rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  table.csv-table th,table.csv-table td{border:1px solid var(--line);padding:.3rem .6rem;
    white-space:pre;text-align:left}
  table.csv-table thead th{position:sticky;top:0;background:var(--panel);z-index:1}
  table.csv-table tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
  .y-children{margin-left:1.1rem;border-left:1px solid var(--line);padding-left:.8rem}
  .y-row{padding:.05rem 0}
  details.y-node>summary{cursor:pointer;list-style:none;user-select:none;padding:.05rem 0}
  details.y-node>summary::-webkit-details-marker{display:none}
  details.y-node>summary::before{content:"\25B6";display:inline-block;width:1em;color:var(--muted);
    font-size:.7em;transition:transform .12s}
  details.y-node[open]>summary::before{transform:rotate(90deg)}
  .y-key{color:var(--accent);margin-right:.15rem}
  .y-key::after{content:":";color:var(--muted)}
  .y-badge{color:var(--muted);font-size:.8em}
  .y-empty{color:var(--muted)}
  .y-val{margin-left:.35rem}
  .y-string{color:var(--accent-2)}
  .y-number{color:#f0b36b}
  .y-boolean{color:#d39bff}
  .y-null{color:var(--muted);font-style:italic}
  #image{display:none;position:absolute;inset:0;overflow:hidden;
    align-items:center;justify-content:center;user-select:none;touch-action:none}
  #image.bg-dark{background:var(--bg)}
  #image.bg-light{background:#f5f5f5}
  #image.bg-check{background-color:#0b0e12;
    background-image:linear-gradient(45deg,#1b2128 25%,transparent 25%),
      linear-gradient(-45deg,#1b2128 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1b2128 75%),
      linear-gradient(-45deg,transparent 75%,#1b2128 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  #image img{position:absolute;top:0;left:0;max-width:none;transform-origin:0 0;
    image-rendering:auto;box-shadow:0 4px 24px rgba(0,0,0,.5);will-change:transform}
  #image.dragging{cursor:grabbing}
  #imgPanel{position:absolute;right:.75rem;top:.75rem;background:rgba(16,20,24,.85);
    border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;font-size:.85rem;
    display:flex;flex-direction:column;gap:.4rem;min-width:180px;backdrop-filter:blur(6px)}
  #imgPanel .row{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:var(--muted)}
  #imgPanel .btns{display:flex;gap:.35rem}
  #imgPanel button{font:inherit;color:var(--text);background:#0b0e12;border:1px solid var(--line);
    border-radius:6px;padding:.25rem .5rem;cursor:pointer;flex:1}
  #imgPanel button:hover{border-color:var(--accent)}
  #imgPanel select{font:inherit;color:var(--text);background:#0b0e12;border:1px solid var(--line);
    border-radius:6px;padding:.2rem .4rem}
  #imgInfo{position:absolute;left:.75rem;bottom:.75rem;background:rgba(16,20,24,.85);
    border:1px solid var(--line);border-radius:8px;padding:.45rem .65rem;font-size:.8rem;color:var(--muted);
    pointer-events:none;backdrop-filter:blur(6px)}
  #three{display:none;width:100%;height:100%}
  #info{position:absolute;left:.75rem;bottom:.75rem;background:rgba(16,20,24,.85);
    border:1px solid var(--line);border-radius:8px;padding:.45rem .65rem;font-size:.8rem;color:var(--muted);
    pointer-events:none;backdrop-filter:blur(6px)}
  #panel{position:absolute;right:.75rem;top:.75rem;background:rgba(16,20,24,.85);
    border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;font-size:.85rem;
    display:flex;flex-direction:column;gap:.4rem;min-width:180px;backdrop-filter:blur(6px)}
  /* the display:flex above would otherwise defeat the `hidden` attribute */
  #panel[hidden]{display:none}
  #panel label{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:var(--muted)}
  #panel input[type=color]{width:32px;height:22px;border:none;background:transparent;padding:0}
  #panel button{font:inherit;color:var(--text);background:#0b0e12;border:1px solid var(--line);
    border-radius:6px;padding:.25rem .5rem;cursor:pointer}
  #panel button:hover{border-color:var(--accent)}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:#ff9090;padding:2rem;text-align:center;white-space:pre-wrap;font-family:ui-monospace,monospace}
</style>
</head>
<body>

<header>
  <h1>localViewer</h1>
  <span class="badge" id="kindBadge">no file</span>
  <span class="fileinfo" id="fileInfo" hidden>
    <span class="fname" id="fileName"></span>
    <span class="fpath" id="filePath"></span>
  </span>
  <span class="spacer"></span>
  <button id="openFolderBtn" hidden title="Copy the containing folder path">Open folder</button>
  <label for="picker">Open file</label>
  <input id="picker" type="file" accept=".md,.markdown,.txt,.yaml,.yml,.csv,.stl,.3mf,.step,.stp,.svg,.png,.jpg,.jpeg,.gif,.webp,.bmp,.ico,.avif" multiple>
  <button id="installBtn" type="button" hidden>Install app</button>
</header>

<nav id="tabbar" role="tablist" hidden></nav>

<main>
  <div id="drop">
    <div class="big">Drop a <code>.md</code>, <code>.yaml</code>, <code>.csv</code>, <code>.stl</code>, <code>.3mf</code>, <code>.step</code>, <code>.svg</code>, or image file here</div>
    <div>or click <strong>Open file</strong>, or pass <code>?src=URL</code> in the address.</div>
    <div style="opacity:.7">Click <strong>Install app</strong> once — then these files open straight from Explorer via <em>Open with → localViewer</em>.</div>
  </div>
  <article id="md"></article>
  <section id="yaml">
    <div class="y-toolbar">
      <button id="yExpand" type="button">Expand all</button>
      <button id="yCollapse" type="button">Collapse all</button>
    </div>
    <div id="yamlTree" class="y-tree"></div>
  </section>
  <section id="csv">
    <div class="y-toolbar">
      <label><input id="csvHeaderToggle" type="checkbox" checked> First row is header</label>
      <span class="spacer"></span>
      <span id="csvInfo" class="info"></span>
    </div>
    <div id="csvTable" class="csv-scroll"></div>
  </section>
  <div id="image">
    <img id="imgEl" alt="">
    <div id="imgPanel">
      <div class="btns">
        <button id="imgZoomOut" type="button" title="Zoom out">&minus;</button>
        <button id="imgZoomIn" type="button" title="Zoom in">+</button>
      </div>
      <div class="btns">
        <button id="imgFit" type="button">Fit</button>
        <button id="imgActual" type="button">100%</button>
      </div>
      <label class="row">Background
        <select id="imgBg">
          <option value="bg-dark">Dark</option>
          <option value="bg-check">Checker</option>
          <option value="bg-light">Light</option>
        </select>
      </label>
    </div>
    <div id="imgInfo"></div>
  </div>
  <div id="three"></div>
  <div id="panel" hidden>
    <label>Color <input id="colorPick" type="color" value="#8fb8e6"></label>
    <label>Wireframe <input id="wireToggle" type="checkbox"></label>
    <label>Grid <input id="gridToggle" type="checkbox" checked></label>
    <button id="fitBtn">Fit view</button>
  </div>
  <div id="info"></div>
  <div id="err"></div>
</main>

<!-- Classic (non-module) script: exposes the global `occtimportjs` factory used
     to lazily instantiate the OpenCascade WASM build for STEP import. -->
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
<script type="module" src="app.js"></script>
<div id="toast" style="position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:#16321f;color:#cfeede;border:1px solid #2e6b45;border-radius:10px;
  padding:.6rem .9rem;font:14px/1.4 system-ui;max-width:90vw;display:none;z-index:50;
  box-shadow:0 6px 24px rgba(0,0,0,.4)"></div>

<script>
  // PWA install hook
  let deferredPrompt = null;
  const btn = document.getElementById('installBtn');
  const toast = document.getElementById('toast');
  function showToast(msg, ms = 6000) {
    toast.textContent = msg; toast.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toast.style.display = 'none'; }, ms);
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e; btn.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (!deferredPrompt) {
      showToast('Use the install icon in the address bar, then localViewer will register for .md/.stl/.3mf.');
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === 'accepted') btn.hidden = true;
  });

  // After install, Edge registers file_handlers from the manifest automatically.
  window.addEventListener('appinstalled', () => {
    btn.hidden = true;
    showToast('Installed. localViewer is now registered for .md / .stl / .3mf — '
      + 'right-click a file → Open with → localViewer.', 9000);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
